name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "ios/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "ios/**"

jobs:
  backend:
    name: Backend (lint + format + types + tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: caseduo
          POSTGRES_PASSWORD: caseduo_dev
          POSTGRES_DB: caseduo_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U caseduo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install backend deps + test deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: backend
        run: ruff check app/ tests/

      - name: Ruff format check
        working-directory: backend
        run: ruff format app/ tests/ --check

      - name: Mypy typecheck
        working-directory: backend
        run: mypy app/

      - name: Run tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+asyncpg://caseduo:caseduo_dev@localhost:5433/caseduo_test"
          JWT_SECRET: "ci-test-secret-not-for-production-32-bytes-min"
        run: pytest --cov=app --cov-report=term --cov-fail-under=70

  docker-build:
    name: Docker image build check
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          push: false
          load: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          tags: caseduo-backend:ci
